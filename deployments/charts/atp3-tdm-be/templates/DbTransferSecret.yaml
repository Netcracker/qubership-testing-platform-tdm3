{{- if and .Values.atp3tdm.dbTransfer.enabled (not .Values.atp3tdm.dbTransfer.existingSecret) (ne .Values.PAAS_PLATFORM "COMPOSE") }}
{{- $name := include "atp3tdm.dbTransfer.secretName" . }}
{{- $key := include "atp3tdm.dbTransfer.suppliedKey" . }}
{{- if not $key }}
{{- /* Generating the key at every render would change it at every upgrade, so reuse the key of the Secret that exists. */}}
{{- $stored := dig "data" "TDM_DB_TRANSFER_KEY" "" (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $key = ternary (randAlphaNum 48) ($stored | b64dec) (empty $stored) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  TDM_DB_TRANSFER_KEY: {{ $key | quote }}
{{- end }}
