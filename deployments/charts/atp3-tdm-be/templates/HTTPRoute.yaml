{{- if contains "gateway-api-default" .Values.GATEWAY_SYSTEM_TYPE }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: '{{ .Values.SERVICE_NAME }}'
  labels:
    app: '{{ .Values.SERVICE_NAME }}'
spec:
  hostnames:
    - '{{ include "atp3tdm.env.ingressHost" . }}'
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.GATEWAY_SYSTEM_NAME }}
      namespace: {{ .Values.GATEWAY_SYSTEM_NAMESPACE }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: '{{ .Values.SERVICE_NAME }}'
          port: {{ .Values.atp3tdm.serverPort }}
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
