# MD024/no-duplicate-heading: allow the same heading under different parents, such as the "Added", "Changed",
# and "Fixed" sections Keep a Changelog (CHANGELOG.md) repeats under every release.
MD024:
  siblings_only: true

# MD013/line-length : Line length : https://github.com/DavidAnson/markdownlint/blob/v0.37.4/doc/md013.md
MD013:
  # Number of characters
  line_length: 500
  # Number of characters for headings
  heading_line_length: 100
  # Number of characters for code blocks
  code_block_line_length: 500
  # Include code blocks
  code_blocks: true
  # Include tables
  tables: false
  # Include headings
  headings: true
  # Strict length checking
  strict: false
  # Stern length checking
  stern: false